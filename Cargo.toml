bin = [
    { name = "greentic-operator", path = "src/main.rs" },
]

[package]
name = "greentic-operator"
version = "1.1.0-dev.0"
edition = "2024"
rust-version = "1.91"
description = "Greentic operator CLI for local dev and demo orchestration."
license = "MIT"
repository = "https://github.com/greenticai/greentic-operator"
homepage = "https://github.com/greenticai/greentic-operator"
readme = "README.md"
autobins = false
include = [
    "src/**",
    "i18n/operator_cli/*.json",
    "i18n/operator_wizard/*.json",
    "README.md",
    "Cargo.toml",
    "Cargo.lock",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tgz"
pkg-fmt = "tgz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
directories-next = "2"
greentic-setup = ">=1.1.0-dev, <1.2.0-0"
greentic-i18n = ">=1.1.0-dev, <1.2.0-0"
greentic-qa-lib = ">=1.1.0-dev, <1.2.0-0"
greentic-start = ">=1.1.0-dev, <1.2.0-0"
greentic-state = ">=1.1.0-dev, <1.2.0-0"
http-body-util = "0.1"
hyper-util = "0.1"
include_dir = "0.7"
jsonschema = "0.45"
libc = "0.2"
once_cell = "1.21"
qa-spec = ">=1.1.0-dev, <1.2.0-0"
rand = "0.10"
rpassword = "7"
semver = "1"
serde_cbor = "0.11"
serde_json = "1.0"
sys-locale = "0.3"
sysinfo = "0.38"
tracing = "0.1"
tracing-subscriber = "0.3"
tar = "0.4"
unic-langid = "0.9"
zip = "8"

[dependencies.clap]
version = "4.5"
features = [
    "derive",
]

[dependencies.greentic-distributor-client]
version = ">=1.1.0-dev, <1.2.0-0"
default-features = false
features = [
    "pack-fetch",
]

[dependencies.greentic-interfaces]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-interfaces-guest]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-interfaces-host]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-interfaces-wasmtime]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-runner-desktop]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-runner-host]
version = ">=1.1.0-dev, <1.2.0-0"

[dependencies.greentic-secrets-lib]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "providers-dev",
]

[dependencies.greentic-telemetry]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "otlp",
    "fmt",
]

[dependencies.greentic-types]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "serde",
]

[dependencies.hyper]
version = "1"
features = [
    "full",
]

[dependencies.oci-distribution]
version = "0.11"
default-features = false
features = [
    "rustls-tls",
]

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.serde_yaml_bw]
package = "serde_yaml_gtc"
version = "2.5.2"

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "sync",
    "signal",
    "net",
]

[dependencies.ureq]
version = "3"
features = [
    "json",
]

[dependencies.uuid]
version = "1"
features = [
    "v4",
]

[dev-dependencies]
indexmap = "2"
tempfile = "3.10"

[workspace]
members = [
    "secret_name",
    "crates/greentic-secrets-repro",
]

[workspace.dependencies]
anyhow = "1.0"
tempfile = "3.10"
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "sync",
    "signal",
    "net",
]

[workspace.dependencies.greentic-secrets-lib]
version = ">=1.1.0-dev, <1.2.0-0"
features = [
    "providers-dev",
]

[workspace.dependencies.uuid]
version = "1"
features = [
    "v4",
]
